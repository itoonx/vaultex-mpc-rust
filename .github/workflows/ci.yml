name: CI

# Integrity rules (ROADMAP M5 #6):
# - Every `run:` step runs under bash with `set -euo pipefail` (defaults.run below), so any failing
#   command, including one inside a pipeline, fails its step. Gating is by exit code only.
# - Every action is pinned to a full commit SHA; the trailing comment names the ref it was resolved
#   from on 2026-10-11. Bump pins deliberately, never back to a moving tag or branch.
# - The workflow token is read-only; a job that needs more declares exactly that.
#
# Canary procedure (owner-run; proves a failing test turns CI red):
#   1. Cut a throwaway branch from the integration tip, e.g. `canary/ci-red-YYYYMMDD`.
#   2. Add one deliberately failing unit test to any workspace crate and change nothing else, e.g.
#        #[test] fn ci_canary_must_fail() { panic!("CI canary: this run must be red"); }
#   3. Push it and open a PR to main. Expected on both the push and the PR run: "Build & Test" is
#      red at "Run tests", with the canary listed as FAILED. A green result means the gate is
#      broken: stop and fix this file before trusting any CI result.
#   4. Record the red run URLs, close the PR, delete the branch, then record a green run on main.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded runs on feature branches and PRs are cancelled; a run already in progress on main or
# dev is never cancelled (a newer push may still replace one that is only queued).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.93.1 # = the locally verified toolchain; a moving "stable" broke clippy (1.99 lints)
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Single build job that compiles once, shares artifacts with downstream jobs
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.93.1 # = the locally verified toolchain; a moving "stable" broke clippy (1.99 lints)
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)
        with:
          shared-key: "rust-workspace"
          cache-targets: true

      # Clippy (compiles everything as a side effect)
      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Tests (reuses clippy compilation — near-zero compile time)
      # Run with --test-threads=4 to validate multi-thread safety (LazyLock, LocalTransport isolation)
      # The gate is cargo's exit code; there is no test-count floor.
      - name: Run tests
        run: cargo test --workspace --features local-transport -- --test-threads=4

  # Shipped-build guard (ROADMAP M5 #8): builds the node and gateway in release exactly as
  # infra/docker/Dockerfile ships them (only those two packages, so no workspace feature
  # unification) and fails if test parameters or experimental features are linked. A canary rebuild
  # with test parameters must be flagged and refused at startup first. No rust-cache step: every run
  # builds in a fresh target dir.
  shipped-build:
    name: Shipped-build guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.93.1 # = the locally verified toolchain; a moving "stable" broke clippy (1.99 lints)
      - name: Test the checker
        run: python3 -B -m unittest discover -s scripts/ci -p test_shipped_build.py
      - name: Build as shipped and check linked features
        run: python3 -B scripts/ci/shipped_build.py

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # audit-check publishes its findings as a "Security audit" check run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false
      # Use pre-built cargo-audit from GitHub Action (no compile from source)
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}

  e2e:
    name: E2E tests (Vault + Redis + NATS)
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main'
    services:
      vault:
        image: hashicorp/vault:1.15
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
        options: >-
          --cap-add IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "wget --spider -q http://localhost:8222/healthz || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.93.1 # = the locally verified toolchain; a moving "stable" broke clippy (1.99 lints)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)
        with:
          shared-key: "rust-workspace"

      - name: Provision Vault secrets
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: dev-root-token
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          SERVER_SIGNING_KEY=$(openssl rand -hex 32)
          SESSION_ENCRYPTION_KEY=$(openssl rand -hex 32)

          curl -sf -X POST "$VAULT_ADDR/v1/secret/data/mpc-wallet/gateway" \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"jwt_secret\":\"$JWT_SECRET\",\"server_signing_key\":\"$SERVER_SIGNING_KEY\",\"session_encryption_key\":\"$SESSION_ENCRYPTION_KEY\",\"redis_url\":\"redis://127.0.0.1:6379\"}}"

          curl -sf "$VAULT_ADDR/v1/secret/data/mpc-wallet/gateway" \
            -H "X-Vault-Token: $VAULT_TOKEN" | jq '.data.data | keys'

      - name: Build gateway
        run: cargo build -p mpc-wallet-api

      - name: Start gateway
        env:
          SECRETS_BACKEND: vault
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: dev-root-token
          NETWORK: testnet
          SESSION_BACKEND: redis
          REDIS_URL: redis://127.0.0.1:6379
          NATS_URL: nats://127.0.0.1:4222
          PORT: "3000"
          RUST_LOG: mpc_wallet_api=info
        run: |
          chmod +x target/debug/mpc-wallet-api
          target/debug/mpc-wallet-api &
          echo $! > /tmp/gateway.pid
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:3000/v1/health > /dev/null 2>&1; then
              echo "Gateway is healthy"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Gateway failed to start" && exit 1
            fi
            sleep 1
          done

      - name: Run E2E tests
        timeout-minutes: 20
        env:
          NATS_URL: nats://127.0.0.1:4222
          REDIS_URL: redis://127.0.0.1:6379
          GATEWAY_URL: http://127.0.0.1:3000
        run: |
          # E2E tests — skip NATS protocol tests (need real multi-node infra, not CI containers)
          # These pass with local-infra.sh but CI's shared vCPU causes MtA Paillier timeouts
          cargo test -p mpc-wallet-core --test e2e_tests --features local-transport -- --ignored --test-threads=1 \
            --skip test_nats_sign_gg20_direct \
            --skip test_distributed_keygen_then_sign
          kill "$(cat /tmp/gateway.pid)" 2>/dev/null || true

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.93.1 # = the locally verified toolchain; a moving "stable" broke clippy (1.99 lints)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)
        with:
          shared-key: "rust-workspace"
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Run coverage
        continue-on-error: true
        run: |
          cargo tarpaulin --workspace --features local-transport --skip-clean --out xml --output-dir coverage/ 2>&1 | tee /tmp/coverage.txt
          COVERAGE=$(grep "coverage:" /tmp/coverage.txt | tail -1 | grep -oP '[\d.]+(?=%)')
          echo "Coverage: ${COVERAGE}%"
          # Warn but don't fail yet — establish baseline first
          if [ -n "$COVERAGE" ]; then
            COVERAGE_INT=${COVERAGE%.*}
            if [ "$COVERAGE_INT" -lt 50 ]; then
              echo "::warning::Code coverage is ${COVERAGE}% (target: >80%)"
            fi
          fi

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.93.1 # = the locally verified toolchain; a moving "stable" broke clippy (1.99 lints)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)
        with:
          prefix-key: "bench-"
          shared-key: "rust-bench"
          cache-targets: true
          # Criterion stores baselines in target/criterion/
          cache-directories: "target/criterion"

      # On push to main: save baseline for future PR comparisons
      - name: Run benchmarks (save baseline)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cargo bench --workspace --features local-transport -- --save-baseline main 2>&1 | tee /tmp/bench.txt
          echo "::notice::Benchmark baseline saved for main branch"

      # On PR: compare against saved main baseline
      - name: Run benchmarks (compare against baseline)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          # TODO: fail on >20% regression once baseline is stable
          cargo bench --workspace --features local-transport -- --baseline main 2>&1 | tee /tmp/bench.txt
          echo "::notice::Benchmark comparison against main baseline — review output for regressions"
