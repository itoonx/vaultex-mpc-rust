name: Release

# Auto-release is DISABLED (ROADMAP M5 #6). Nothing tags or publishes on push any more; a release
# happens only when a maintainer runs this workflow by hand from `main` (Actions -> Release ->
# Run workflow). Releases cut here are UNSIGNED and carry no provenance or SBOM.
#
# Signed releases return in M7 (the Guard) and M11 (the full stack): cosign-signed reproducible
# builds with SLSA provenance, a CycloneDX SBOM and digest-pinned images. Release automation is
# re-enabled only in that form (M11 #5); until then, keep this workflow manual.
#
# ponytail: the script below is kept as-is apart from least privilege, a SHA-pinned checkout and
# moving every expression value into `env:` (no `${{ }}` inside `run:`). It still uses the
# runner's default `bash -e`; the signed-release workflow replaces it wholesale, so it is not
# reworked further.

on:
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once, and never cancel one that has started.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Manual Release (unsigned)
    # Same invariant as the old push-to-main trigger: only `main` is ever released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag and the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          fetch-depth: 0  # need full history for tag + changelog

      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $TAG"

      - name: Determine version bump from commits
        id: bump
        env:
          LATEST_TAG: ${{ steps.latest_tag.outputs.tag }}
        run: |
          # Get commit messages since last tag
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --format="%s" HEAD)
          else
            COMMITS=$(git log --format="%s" "$LATEST_TAG"..HEAD)
          fi

          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commits — skipping release"
            exit 0
          fi

          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"

          # Determine bump type
          BUMP="none"
          if echo "$COMMITS" | grep -qiE "^feat(\(.+\))?!:|^BREAKING CHANGE:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qiE "^fix(\(.+\))?:"; then
            BUMP="patch"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No feat/fix commits — skipping release"
            exit 0
          fi

          # Parse current version
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          {
            echo "skip=false"
            echo "version=$NEW_VERSION"
            echo "bump=$BUMP"
          } >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP → v$NEW_VERSION"

      - name: Generate changelog
        if: steps.bump.outputs.skip != 'true'
        id: changelog
        env:
          LATEST_TAG: ${{ steps.latest_tag.outputs.tag }}
        run: |
          {
            echo "changelog<<CHANGELOG_EOF"

            # Features
            if [ "$LATEST_TAG" = "v0.0.0" ]; then
              FEATS=$(git log --format="%s" HEAD | grep -iE "^feat" || true)
              FIXES=$(git log --format="%s" HEAD | grep -iE "^fix" || true)
              OTHERS=$(git log --format="%s" HEAD | grep -viE "^feat|^fix" || true)
            else
              FEATS=$(git log --format="%s" "$LATEST_TAG"..HEAD | grep -iE "^feat" || true)
              FIXES=$(git log --format="%s" "$LATEST_TAG"..HEAD | grep -iE "^fix" || true)
              OTHERS=$(git log --format="%s" "$LATEST_TAG"..HEAD | grep -viE "^feat|^fix" || true)
            fi

            if [ -n "$FEATS" ]; then
              echo "### Features"
              echo "$FEATS" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              echo "### Fixes"
              echo "$FIXES" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi

            if [ -n "$OTHERS" ]; then
              echo "### Other Changes"
              echo "$OTHERS" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi

            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.bump.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.changelog }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES" \
            --target main
          echo "Released $VERSION"
