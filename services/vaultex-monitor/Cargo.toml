[package]
name = "vaultex-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vaultex outflow monitor: watches the chain on independent providers, matches outflows to receipts, alerts on approvals and allowances"
publish = false # working name until ADR-12

# Every crate below is already in Cargo.lock. The monitor links no chain, MPC or kernel crate: it
# reads chain data with its own client and verifies receipts with its own code (ROADMAP WS-07,
# "different implementer"). It shares only the wire types (`vaultex-types`) with the Guard.
[dependencies]
bs58 = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
vaultex-types = { path = "../../crates/vaultex-types" }

[dev-dependencies]
tempfile = "3"
