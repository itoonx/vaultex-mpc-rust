[package]
name = "mpc-wallet-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MPC Node — holds exactly one party's key share, participates in distributed protocols via NATS"

[[bin]]
name = "mpc-node"
path = "src/main.rs"

[features]
default = []
# Debug builds only: lift the release freeze on keygen, raw-digest signing and
# legacy schemes for testnet development. Non-test networks stay refused in every
# build, this feature included. A release build with this feature fails to
# compile; see src/freeze.rs (ROADMAP M5 #5).
dev-unfreeze = []

[dependencies]
mpc-wallet-core = { path = "../../crates/mpc-wallet-core" }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
async-nats = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }

# HTTP (health + metrics endpoints)
axum = "0.8"

# Utilities
hex = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
