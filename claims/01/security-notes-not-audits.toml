id = "01.security-notes-not-audits"
kind = "security-posture"
status = "limitation"
text = "The older internal security notes were written by AI agents during development. They were never independent audits, and their \"resolved\" statuses do not cover the limitations in the banner. The findings log and two CVE reports among them were removed from the tree on 2026-10-16 and remain in git history; the auth review (docs/SECURITY_AUDIT_AUTH.md) is archived with its conclusions withdrawn. SECURITY_STATUS.md is the current list of known weaknesses, by category."
text_zh = "较早的内部安全记录由 AI Agent 在开发过程中编写，并非独立审计，其中的“已解决”状态并不涵盖警示中的限制。这些记录中的发现日志和两份 CVE 报告已于 2026-10-16 从代码树中移除，仍保留在 git 历史中；认证审查（docs/SECURITY_AUDIT_AUTH.md）已归档，其结论已撤回。SECURITY_STATUS.md 是当前按类别列出的已知弱点清单。"
surfaces = ["README.md", "README.zh-CN.md"]
quotes = ["The security notes were written by AI agents during development."]
quotes_zh = ["这些安全记录由 AI Agent 在开发过程中编写，并非独立审计"]
