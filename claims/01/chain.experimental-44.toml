text = "The code names 44 chains besides the six staged ones: 25 EVM networks other than Ethereum; Bitcoin mainnet, Litecoin, Dogecoin and Zcash; six Substrate chains; five Cosmos chains; and Movement, TON, Monero and Starknet. None has end-to-end evidence. They are experimental, and addresses exported for them may be unspendable (limitation 5)."
