text = "The chain transaction encoders work for six chains: TRON, Ethereum, Bitcoin, Solana, Sui and Aptos. Where an official SDK reference exists, nine reference-vector tests pin their output byte-for-byte to it, and the encoders have produced confirmed transactions on public testnets. They are staged: testnet only."
text_zh = "链交易编码器适用于六条链：TRON、Ethereum、Bitcoin、Solana、Sui 和 Aptos。在有官方 SDK 参考实现的情况下，九个参考向量测试将其输出与之逐字节锁定；这些编码器已在公共测试网上产生经确认的交易。状态为预备：仅限测试网。"
