text = "The roadmap (docs/ROADMAP.md) and the task backlog (docs/TASKS.md) are proposals awaiting owner decisions. The proposed first supported scope is a TRON (TRX and TRC-20) signer on an adopted, pinned threshold-ECDSA library, in which every node verifies what it signs. The banner changes only when a roadmap milestone closes on public evidence."
