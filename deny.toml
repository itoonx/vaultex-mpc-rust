# cargo-deny policy (ROADMAP M5 #7, M7 #6). cargo-vet's config is in supply-chain/.
# Check: `cargo deny --locked check advisories bans licenses sources`, with a pinned cargo-deny in CI.
# cargo-deny is not installed on the development machine (Q-RUN-2).
# Format: cargo-deny >= 0.19.0 (the `unsound` scope).
#
# The advisory exceptions mirror .cargo/audit.toml, which also has the reachability notes. Every
# exception is signed off by the owner 2026-10-16 (Q-RUN-5) and states "expires YYYY-MM-DD" in its
# reason. The daily audit workflow fails once that date has passed.
# ponytail: the calendar expiry lives in the reason text. cargo-deny's own `expiry` field counts from
# an advisory's publish date and has not been released yet; switch to it once it ships.

[graph]
# The platforms we build and ship for. Dependencies for other targets are left out of the checks.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
unmaintained = "all"
# Unsound advisories count anywhere in the graph, not only for direct dependencies (the default). Most
# crypto crates arrive transitively, and the daily `cargo audit --deny warnings` already fails on them.
unsound = "all"
# Some ignores name crates that may sit only in Cargo.lock and never in this graph. An unused ignore is
# a warning (the default), so the CI log shows which ones can go.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; BUILD-TIME proc-macro via alloy-primitives; upstream fix only; signed off by the owner 2026-10-16 (Q-RUN-5); expires 2026-12-14" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill unmaintained; NOT COMPILED for shipped targets; upstream fix only; signed off by the owner 2026-10-16 (Q-RUN-5); expires 2026-12-14" },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained; NOT COMPILED (lockfile-only optional dep of ruint); upstream fix only; signed off by the owner 2026-10-16 (Q-RUN-5); expires 2026-12-14" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; NOT COMPILED (lockfile-only, alloy-sol-macro); upstream fix only; signed off by the owner 2026-10-16 (Q-RUN-5); expires 2026-12-14" },
]

[licenses]
# Permissive licences found in today's dependency graph. The project licence itself is ADR-02.
# Checked against `cargo metadata` for the three targets on 2026-10-11: every crate's licence expression
# is satisfied, every entry below is used, and each exception matches a crate in the graph.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# Per-crate exceptions, signed off by the owner 2026-10-16 (Q-RUN-5). MPL-2.0 is file-level copyleft;
# MITNFA is MIT plus a no-false-attribution clause.
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" }, # via dirs (CLI)
    { allow = ["MPL-2.0"], crate = "fastrlp" },    # lockfile-only optional dep of ruint
    { allow = ["MITNFA"], crate = "hex_lit" },     # via bitcoin
]

[bans]
# Many duplicate majors today (alloy, ark-*, rand); tighten after the M5 cut shrinks the graph.
multiple-versions = "warn"
wildcards = "deny"
# Exempts path dependencies only in crates marked `publish = false`. The legacy mpc-wallet-* crates do
# not have that line yet (requested; it also blocks an accidental crates.io publish before ADR-12).
allow-wildcard-paths = true
deny = [
    # One TLS stack: rustls. Each of these would add a second TLS implementation (OpenSSL or the
    # platform's) to review.
    { crate = "openssl", reason = "rustls only" },
    { crate = "openssl-sys", reason = "rustls only" },
    { crate = "native-tls", reason = "rustls only" },
    # Kernel and Guard crypto (the cargo-vet crypto-reviewed set): exactly one copy of each, so one
    # version is reviewed and no second copy links in. Each has a single version today.
    { crate = "k256", deny-multiple-versions = true },
    { crate = "ecdsa", deny-multiple-versions = true },
    { crate = "elliptic-curve", deny-multiple-versions = true },
    { crate = "crypto-bigint", deny-multiple-versions = true },
    { crate = "ed25519-dalek", deny-multiple-versions = true },
    { crate = "curve25519-dalek", deny-multiple-versions = true },
    { crate = "sha2", deny-multiple-versions = true },
    { crate = "sha3", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
