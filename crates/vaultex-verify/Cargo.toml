[package]
name = "vaultex-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vaultex verifier kernel: signer-side decode, policy, approvals, velocity and receipts (skeleton)"
publish = false # working name until ADR-12

# Kernel boundary (ROADMAP M6 #1): no MPC, transport, async runtime or network crate, here or
# transitively. kernel.yml asserts it with `cargo tree`; clippy.toml bans clock, env and sockets.
[dependencies]
vaultex-types = { path = "../vaultex-types" }
# Receipt signatures (M6 #6). Already in Cargo.lock through vaultex-types' tests and the legacy crates.
ed25519-dalek = { workspace = true }
# BCS layout of the policy bundle (M6 #3), encoded through vaultex-types. Already in Cargo.lock.
serde = { workspace = true }

[dev-dependencies]
# Reads the JSON vector files shared with the independent oracle (KAT plan R8).
serde_json = { workspace = true }
