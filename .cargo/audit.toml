# RustSec exceptions for `cargo audit` (ROADMAP M5 #7). deny.toml carries the same list for cargo-deny.
#
# Re-reviewed 2026-10-11 against the RustSec database. Reachability was checked with `cargo tree -i`
# (per shipped target, and with `--target all --all-features -e all` for "compiled at all") and with
# a search of the workspace code.
#
# Every entry is an exception signed off by the owner 2026-10-16 (Q-RUN-5) and carries
# "expires YYYY-MM-DD". The daily workflow (.github/workflows/audit.yml) fails once that date has
# passed. Renew an entry only after a fresh reachability review.
#
# Verdicts:
#   NOT COMPILED  only in Cargo.lock: an optional dependency that Cargo locks through a weak feature,
#                 or a dependency for targets we do not ship. No code from it is built.
#   BUILD-TIME    a proc-macro. It runs inside the compiler, and none of its code ships in a binary.
#   UNREACHED     compiled, but the affected code path is never called.
#   IN USE        compiled and called. Used only for "unmaintained" notices with no known vulnerability.
#
# RUSTSEC-2026-0220 (ruint < 1.20, compiled via alloy-primitives) is fixed by the lockfile-only bump to
# ruint 1.20.1 (owner-approved 2026-10-13). The ark-* 0.6 entries it locks are never compiled.
#
# Closed 2026-10-16 (T02-4b), the crates have left Cargo.lock: RUSTSEC-2026-0049/0098/0099/0104
# (rustls-webpki 0.102, by async-nats 0.47), RUSTSEC-2024-0437 (protobuf 2, by building prometheus
# without default features) and RUSTSEC-2025-0134 (rustls-pemfile, replaced by the rustls-pki-types
# PEM decoder).

[advisories]
ignore = [
    # Unmaintained, and only an upstream release can fix them.
    "RUSTSEC-2024-0436", # paste (alloy-primitives); BUILD-TIME; signed off by the owner 2026-10-16 (Q-RUN-5); expires 2026-12-14
    "RUSTSEC-2023-0089", # atomic-polyfill (frost-core > postcard > heapless 0.7), only for targets without native atomics; NOT COMPILED; signed off by the owner 2026-10-16 (Q-RUN-5); expires 2026-12-14
    "RUSTSEC-2024-0388", # derivative (ruint's optional ark-ff 0.3/0.4); NOT COMPILED; signed off by the owner 2026-10-16 (Q-RUN-5); expires 2026-12-14
    "RUSTSEC-2026-0173", # proc-macro-error2 (alloy-sol-macro); NOT COMPILED; signed off by the owner 2026-10-16 (Q-RUN-5); expires 2026-12-14
]
